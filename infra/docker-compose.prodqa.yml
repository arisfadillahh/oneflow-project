services:
  app-backend:
    environment:
      APP_ENV: development
      POSTGRES_DSN: postgres://postgres:postgres@postgres:5432/oneflow?sslmode=disable
      JWT_SECRET: prodqa-jwt-secret
      INTERNAL_GATEWAY_TOKEN: prodqa-internal-token
      OBJECT_STORAGE_ENDPOINT: http://minio:9000
      OBJECT_STORAGE_ACCESS_KEY: minioadmin
      OBJECT_STORAGE_SECRET_KEY: minioadmin
      OBJECT_STORAGE_PUBLIC_BASE_URL: http://localhost:9000
      WEBSOCKET_ALLOWED_ORIGINS: http://localhost:3000
      WA_GATEWAY_BASE_URL: http://wa-gateway:8090
      AI_SERVICE_BASE_URL: http://ai-service:8000

  wa-gateway:
    environment:
      APP_ENV: development
      POSTGRES_DSN: postgres://postgres:postgres@postgres:5432/oneflow?sslmode=disable
      WA_SESSION_DSN: postgres://postgres:postgres@postgres:5432/oneflow?sslmode=disable
      APP_BACKEND_BASE_URL: http://app-backend:8080
      INTERNAL_GATEWAY_TOKEN: prodqa-internal-token
      WA_MODE: real

  worker:
    environment:
      POSTGRES_DSN: postgres://postgres:postgres@postgres:5432/oneflow?sslmode=disable
      OBJECT_STORAGE_ENDPOINT: http://minio:9000
      OBJECT_STORAGE_ACCESS_KEY: minioadmin
      OBJECT_STORAGE_SECRET_KEY: minioadmin

  ai-service:
    environment:
      POSTGRES_DSN: postgres://postgres:postgres@postgres:5432/oneflow?sslmode=disable
