<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bgGrad" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f0f7ff"/>
      <stop offset="1" stop-color="#e0efff"/>
    </linearGradient>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#d5e8fb" stroke-width="1" opacity="0.5"/>
    </pattern>
    <radialGradient id="glow1" cx="20%" cy="30%" r="50%">
      <stop offset="0" stop-color="#8bdcff" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#8bdcff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="80%" cy="70%" r="50%">
      <stop offset="0" stop-color="#a7c7ff" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#a7c7ff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Base background -->
  <rect width="100%" height="100%" fill="url(#bgGrad)"/>

  <!-- Tech Grid -->
  <rect width="100%" height="100%" fill="url(#grid)"/>

  <!-- Soft Glows -->
  <rect width="100%" height="100%" fill="url(#glow1)"/>
  <rect width="100%" height="100%" fill="url(#glow2)"/>

  <!-- Abstract Tech Lines / Data Flows -->
  <g stroke-linecap="round" fill="none">
    <path d="M-100,200 L400,200 L600,400 L1200,400 L1400,200 L2000,200" stroke="#7ccfff" stroke-width="4" opacity="0.3"/>
    <path d="M-100,800 L300,800 L500,600 L1300,600 L1500,800 L2000,800" stroke="#9bddff" stroke-width="6" opacity="0.2"/>
    <path d="M200,-100 L200,300 L400,500 L400,1200" stroke="#a7c7ff" stroke-width="3" opacity="0.4"/>
    <path d="M1600,-100 L1600,400 L1400,600 L1400,1200" stroke="#d8d2ff" stroke-width="5" opacity="0.3"/>
  </g>

  <!-- Network Nodes -->
  <circle cx="400" cy="200" r="8" fill="#2563eb" opacity="0.6"/>
  <circle cx="600" cy="400" r="10" fill="#21b7ff" opacity="0.5"/>
  <circle cx="1200" cy="400" r="6" fill="#7c4dff" opacity="0.5"/>
  <circle cx="1400" cy="200" r="8" fill="#2563eb" opacity="0.6"/>
  <circle cx="300" cy="800" r="7" fill="#7c4dff" opacity="0.4"/>
  <circle cx="500" cy="600" r="9" fill="#21b7ff" opacity="0.6"/>
  <circle cx="1300" cy="600" r="8" fill="#2563eb" opacity="0.5"/>
  <circle cx="1500" cy="800" r="6" fill="#7c4dff" opacity="0.5"/>

  <circle cx="200" cy="300" r="6" fill="#21b7ff" opacity="0.4"/>
  <circle cx="400" cy="500" r="8" fill="#7c4dff" opacity="0.5"/>
  <circle cx="1600" cy="400" r="7" fill="#2563eb" opacity="0.5"/>
  <circle cx="1400" cy="600" r="9" fill="#21b7ff" opacity="0.4"/>

</svg>
