  <defs>
    <style>
      .f{font-family:Poppins,Inter,"Segoe UI",Arial,sans-serif}
      .title{font-size:14px;font-weight:700;fill:#071c4d}
      .copy{font-size:12px;font-weight:500;fill:#51657d}
      .tag{font-size:11px;font-weight:700;fill:#7c4dff;letter-spacing:.5px}
    </style>
  </defs>
  <rect width="440" height="108" rx="18" fill="#fff" stroke="#dde9f4"/>
  <rect x="15" y="16" width="76" height="76" rx="18" fill="#f4efff"/>
  <path d="M53 33a14 14 0 0 0-14 14v11l-6 9h40l-6-9V47a14 14 0 0 0-14-14z" fill="#7c4dff"/>
