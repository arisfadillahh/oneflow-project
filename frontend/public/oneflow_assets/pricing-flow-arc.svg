<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 897 420" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="brand" x1="0" x2="1" y1="0" y2="1">
      <stop stop-color="#21b7ff"/>
      <stop offset=".58" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#7c4dff"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="15" stdDeviation="15" flood-color="#0f3d91" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Sleek tech data connection line -->
  <path d="M 50 250 L 300 250 L 450 100 L 700 100 L 850 200" fill="none" stroke="#dbeafe" stroke-width="6" stroke-dasharray="10 10" opacity="0.8"/>
  <path d="M 150 120 L 400 120 L 500 220 L 800 220" fill="none" stroke="#bfdbfe" stroke-width="4" opacity="0.6"/>

  <g filter="url(#shadow)">
    <!-- Node 1 -->
    <rect x="80" y="210" width="180" height="80" rx="16" fill="#ffffff" stroke="#e2e8f0"/>
    <circle cx="120" cy="250" r="16" fill="#22c55e"/>
    <rect x="150" y="235" width="80" height="10" rx="5" fill="#e2e8f0"/>
    <rect x="150" y="255" width="50" height="8" rx="4" fill="#cbd5e1"/>

    <!-- Central Node -->
    <rect x="350" y="50" width="220" height="100" rx="20" fill="#ffffff" stroke="#dbeafe"/>
    <circle cx="400" cy="100" r="22" fill="url(#brand)"/>
    <rect x="440" y="80" width="100" height="14" rx="7" fill="#e2e8f0"/>
    <rect x="440" y="105" width="70" height="10" rx="5" fill="#cbd5e1"/>

    <!-- Right Node -->
    <rect x="660" y="160" width="190" height="80" rx="16" fill="#071c4d"/>
    <circle cx="705" cy="200" r="16" fill="#21b7ff"/>
    <rect x="740" y="185" width="80" height="10" rx="5" fill="#3b82f6"/>
    <rect x="740" y="205" width="50" height="8" rx="4" fill="#60a5fa"/>
  </g>
</svg>
