      .eyebrow{font-size:11px;font-weight:750;letter-spacing:1.1px;fill:#85cfff}
      .head{font-size:22px;font-weight:750;fill:#fff}
      .copy{font-size:13px;font-weight:500;fill:#60748e}
      .label{font-size:16px;font-weight:750;fill:#102653}
      .small{font-size:12px;font-weight:600;fill:#657991}
      .status{font-size:11px;font-weight:750;letter-spacing:.4px}
    </style>
