<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 402" role="img" aria-labelledby="title desc">
  <title id="title">Plugin bisnis Oneflow</title>
  <desc id="desc">Lima plugin bisnis terhubung rapi ke Oneflow AI: follow-up, order, stok, booking, dan notifikasi admin.</desc>
  <defs>
