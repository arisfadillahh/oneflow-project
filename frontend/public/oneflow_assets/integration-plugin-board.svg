    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#16b8ff"/><stop offset=".55" stop-color="#247ef2"/><stop offset="1" stop-color="#714cf4"/></linearGradient>
    <filter id="shadow" x="-16%" y="-16%" width="132%" height="145%"><feDropShadow dx="0" dy="12" stdDeviation="13" flood-color="#11336d" flood-opacity=".08"/></filter>
    <style>
