<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
  <defs>
    <filter id="glass" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="15" stdDeviation="20" flood-color="#0f3d91" flood-opacity="0.1"/>
    </filter>
    <linearGradient id="glassGrad" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.4"/>
    </linearGradient>
    <linearGradient id="glassBorder" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#e2e8f0" stop-opacity="0.2"/>
    </linearGradient>
  </defs>

  <!-- Left Side Floating Card -->
  <g transform="translate(150, 450) rotate(-5)">
    <rect width="240" height="160" rx="20" fill="url(#glassGrad)" filter="url(#glass)" stroke="url(#glassBorder)" stroke-width="2"/>
    <!-- Mock UI lines -->
    <rect x="20" y="25" width="40" height="40" rx="10" fill="#eef6ff"/>
    <circle cx="40" cy="45" r="10" fill="#2563eb"/>
    <rect x="75" y="30" width="100" height="10" rx="5" fill="#cbd5e1"/>
    <rect x="75" y="50" width="60" height="8" rx="4" fill="#e2e8f0"/>
    <rect x="20" y="90" width="200" height="6" rx="3" fill="#e2e8f0"/>
    <rect x="20" y="110" width="160" height="6" rx="3" fill="#e2e8f0"/>
    <rect x="20" y="130" width="180" height="6" rx="3" fill="#e2e8f0"/>
  </g>

  <!-- Right Side Floating Elements -->
  <g transform="translate(1600, 650) rotate(8)">
    <rect width="180" height="120" rx="16" fill="url(#glassGrad)" filter="url(#glass)" stroke="url(#glassBorder)" stroke-width="2"/>
    <circle cx="90" cy="50" r="24" fill="#f0fdf4"/>
    <circle cx="90" cy="50" r="12" fill="#22c55e"/>
    <rect x="40" y="90" width="100" height="8" rx="4" fill="#cbd5e1"/>
  </g>

  <!-- Top Center Floating Bubble -->
  <g transform="translate(1300, 150) rotate(-10)">
    <rect width="200" height="80" rx="40" fill="url(#glassGrad)" filter="url(#glass)" stroke="url(#glassBorder)" stroke-width="2"/>
    <circle cx="40" cy="40" r="16" fill="#fff7ed"/>
    <circle cx="40" cy="40" r="8" fill="#fb923c"/>
    <rect x="70" y="32" width="90" height="6" rx="3" fill="#cbd5e1"/>
    <rect x="70" y="46" width="60" height="6" rx="3" fill="#e2e8f0"/>
  </g>

  <!-- Abstract geometric accents -->
  <circle cx="300" cy="200" r="40" fill="none" stroke="#21b7ff" stroke-width="8" opacity="0.2"/>
  <circle cx="1700" cy="300" r="60" fill="none" stroke="#7c4dff" stroke-width="4" opacity="0.15"/>
  <rect x="100" y="800" width="80" height="80" rx="20" fill="none" stroke="#2563eb" stroke-width="6" opacity="0.1" transform="rotate(15 140 840)"/>
</svg>
