<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" role="img" aria-labelledby="title desc">
  <title id="title">Oneflow AI guardrail and role access</title>
  <desc id="desc">A security dashboard illustrating validated knowledge, admin handoff, role access, and activity audit.</desc>
  <defs>
    <linearGradient id="brand" x1="0" x2="1" y1="0" y2="1">
      <stop stop-color="#21b7ff"/>
      <stop offset=".58" stop-color="#2196f3"/>
      <stop offset="1" stop-color="#7c4dff"/>
    </linearGradient>
    <linearGradient id="canvas" x1="0" x2="1" y1="0" y2="1">
      <stop stop-color="#f7fbff"/>
      <stop offset="1" stop-color="#edf6ff"/>
    </linearGradient>
    <filter id="shadow" x="-12%" y="-12%" width="124%" height="138%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#071c4d" flood-opacity=".1"/>
    </filter>
    <style>
      .f{font-family:Poppins,Inter,"Segoe UI",Arial,sans-serif}
      .eyebrow{font-size:12px;font-weight:700;letter-spacing:1.2px;fill:#087bd8}
      .panel-title{font-size:31px;font-weight:700;fill:#071c4d}
      .summary{font-size:16px;font-weight:500;fill:#51657d}
      .row-title{font-size:19px;font-weight:700;fill:#071c4d}
      .row-copy{font-size:16px;font-weight:500;fill:#51657d}
      .shield-motion{transform-box:fill-box;transform-origin:center;animation:shield-float 4.6s ease-in-out infinite}
      .status-pulse{transform-box:fill-box;transform-origin:center;animation:status-ring 2.4s ease-out infinite}
      .status-dot{animation:status-dot 2.4s ease-in-out infinite}
      .row-bg{animation:row-focus 6.4s ease-in-out infinite}
      .row-icon{transform-box:fill-box;transform-origin:center;animation:icon-focus 6.4s ease-in-out infinite}
      .delay-2{animation-delay:1.6s}
      .delay-3{animation-delay:3.2s}
      .delay-4{animation-delay:4.8s}
      @keyframes shield-float{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
      @keyframes status-ring{0%{opacity:.38;transform:scale(.72)}65%,100%{opacity:0;transform:scale(2.3)}}
      @keyframes status-dot{0%,100%{opacity:1}50%{opacity:.7}}
      @keyframes row-focus{0%,18%,100%{stroke-width:1}7%{stroke:#9dcbff;stroke-width:2}}
      @keyframes icon-focus{0%,18%,100%{transform:scale(1)}7%{transform:scale(1.12)}}
      @media (prefers-reduced-motion:reduce){
        .shield-motion,.status-pulse,.status-dot,.row-bg,.row-icon{animation:none}
      }
    </style>
  </defs>
  <rect width="900" height="620" rx="44" fill="url(#canvas)"/>
  <g filter="url(#shadow)">
    <rect x="38" y="36" width="824" height="548" rx="38" fill="#fff"/>
  </g>
  <rect x="38.5" y="36.5" width="823" height="547" rx="37.5" fill="none" stroke="#e1ecf7"/>

  <g transform="translate(68 67)">
    <rect width="286" height="486" rx="28" fill="#f5faff" stroke="#e2edf8"/>
    <text x="25" y="39" class="f eyebrow">AI SAFETY LAYER</text>
    <g transform="translate(69 77)">
      <g class="shield-motion">
        <g transform="translate(-6 10) scale(1.08 .9)">
          <path d="M74 2l69 27v56c0 57-34 99-69 121C39 184 5 142 5 85V29z" fill="url(#brand)"/>
          <path d="M74 2l69 27v24L74 28 5 54V29z" fill="#fff" opacity=".09"/>
          <path d="M43 100l23 23 43-52" fill="none" stroke="#fff" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
        </g>
      </g>
    </g>
    <rect x="25" y="316" width="130" height="28" rx="14" fill="#e4f3ff"/>
    <circle class="status-pulse" cx="42" cy="330" r="6" fill="#2196f3"/>
    <circle class="status-dot" cx="42" cy="330" r="5" fill="#2196f3"/>
    <text x="54" y="334" class="f eyebrow" style="font-size:11px;letter-spacing:.5px">AKTIF</text>
    <text x="25" y="390" class="f panel-title">Guardrail AI</text>
    <text x="25" y="422" class="f summary">Jawaban tetap sesuai</text>
    <text x="25" y="445" class="f summary">aturan bisnis kamu.</text>
  </g>

  <g transform="translate(388 80)">
    <g>
      <rect class="row-bg" width="412" height="100" rx="22" fill="#f5faff" stroke="#dbeafe"/>
      <circle class="row-icon" cx="43" cy="50" r="20" fill="#22c55e"/>
      <path d="M34 50l7 8 13-16" stroke="#fff" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="79" y="44" class="f row-title">Knowledge tervalidasi</text>
      <text x="79" y="70" class="f row-copy">FAQ, produk, layanan, SOP</text>
    </g>
    <g transform="translate(0 116)">
      <rect class="row-bg delay-2" width="412" height="100" rx="22" fill="#eff8ff" stroke="#c9e4ff"/>
      <circle class="row-icon delay-2" cx="43" cy="50" r="20" fill="#21a4ed"/>
      <path d="M35 50h16M43 42v16" stroke="#fff" stroke-width="4.5" stroke-linecap="round"/>
      <text x="79" y="44" class="f row-title">Handoff admin</text>
      <text x="79" y="70" class="f row-copy">Kasus sensitif masuk antrean</text>
    </g>
    <g transform="translate(0 232)">
      <rect class="row-bg delay-3" width="412" height="100" rx="22" fill="#f4f8ff" stroke="#d4e4ff"/>
      <circle class="row-icon delay-3" cx="43" cy="50" r="20" fill="#087bd8"/>
      <path d="M35 56c2-7 14-7 16 0M43 39a6 6 0 1 1 0 12 6 6 0 0 1 0-12z" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round"/>
      <text x="79" y="44" class="f row-title">Role akses</text>
      <text x="79" y="70" class="f row-copy">Admin, supervisor, agent</text>
    </g>
    <g transform="translate(0 348)">
      <rect class="row-bg delay-4" width="412" height="100" rx="22" fill="#f6f3ff" stroke="#dfd8ff"/>
      <circle class="row-icon delay-4" cx="43" cy="50" r="20" fill="#7c4dff"/>
      <path d="M43 40v11l8 6" stroke="#fff" stroke-width="3.5" fill="none" stroke-linecap="round"/>
      <text x="79" y="44" class="f row-title">Riwayat aktivitas</text>
      <text x="79" y="70" class="f row-copy">Audit chat dan follow-up</text>
    </g>
  </g>
</svg>
