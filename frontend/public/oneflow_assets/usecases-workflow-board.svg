<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 420" role="img" aria-labelledby="title desc">
  <title id="title">Alur template agent Oneflow</title>
  <desc id="desc">Tampilan produk yang mengubah chat masuk menjadi jawaban AI, handoff admin, dan tindak lanjut.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#061849"/>
      <stop offset="1" stop-color="#102e69"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#26c6ff"/>
      <stop offset=".58" stop-color="#2486f2"/>
      <stop offset="1" stop-color="#7353ff"/>
    </linearGradient>
    <filter id="shadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#020e32" flood-opacity=".3"/>
    </filter>
  </defs>
  <rect width="380" height="420" rx="28" fill="url(#bg)"/>
  <circle cx="350" cy="39" r="66" fill="#1c74df" opacity=".15"/>
  <circle cx="35" cy="381" r="86" fill="#29c8f5" opacity=".08"/>
  <rect x="23" y="22" width="334" height="376" rx="22" fill="#091d4d" stroke="#254276"/>
  <text x="44" y="51" fill="#71c9ff" font-family="Arial, sans-serif" font-size="9" font-weight="700" letter-spacing="1.3">ONEFLOW / TEMPLATE AGENT</text>
  <circle cx="320" cy="47" r="5" fill="#22c982">
    <animate attributeName="r" values="5;7;5" dur="2.4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;.55;1" dur="2.4s" repeatCount="indefinite"/>
  </circle>
  <text x="44" y="88" fill="#ffffff" font-family="Arial, sans-serif" font-size="25" font-weight="700" letter-spacing="-.7">Chat masuk</text>
  <text x="44" y="116" fill="#ffffff" font-family="Arial, sans-serif" font-size="25" font-weight="700" letter-spacing="-.7">jadi aksi</text>
  <text x="44" y="140" fill="#9caed1" font-family="Arial, sans-serif" font-size="11">Jawaban, handoff, dan follow-up dalam satu alur.</text>
  <path d="M58 189V309" stroke="#224274" stroke-width="2"/>
  <path d="M58 193V305" stroke="url(#accent)" stroke-width="2" stroke-dasharray="16 104">
    <animate attributeName="stroke-dashoffset" values="0;-120" dur="3.2s" repeatCount="indefinite"/>
  </path>
  <circle cx="58" cy="194" r="8" fill="#28bcff"/>
  <circle cx="58" cy="251" r="8" fill="#338af0"/>
  <circle cx="58" cy="307" r="8" fill="#7353ff"/>
  <g filter="url(#shadow)">
    <rect x="80" y="168" width="246" height="51" rx="13" fill="#fff"/>
    <text x="95" y="188" fill="#72849d" font-family="Arial, sans-serif" font-size="8" font-weight="700">WHATSAPP INBOX</text>
    <text x="95" y="204" fill="#102653" font-family="Arial, sans-serif" font-size="11" font-weight="700">Customer menanyakan layanan</text>
    <rect x="279" y="183" width="31" height="18" rx="9" fill="#e7f7f0"/>
    <text x="288" y="195" fill="#14a46b" font-family="Arial, sans-serif" font-size="7" font-weight="700">NEW</text>
    <rect x="80" y="226" width="246" height="51" rx="13" fill="#eef6ff" stroke="#d8e6fa"/>
    <text x="95" y="246" fill="#4984d7" font-family="Arial, sans-serif" font-size="8" font-weight="700">AI + KNOWLEDGE</text>
    <text x="95" y="262" fill="#102653" font-family="Arial, sans-serif" font-size="11" font-weight="700">Jawaban sesuai SOP siap dikirim</text>
    <rect x="80" y="284" width="246" height="51" rx="13" fill="#161f58" stroke="#2d447c"/>
    <text x="95" y="304" fill="#85ceff" font-family="Arial, sans-serif" font-size="8" font-weight="700">ACTION</text>
    <text x="95" y="320" fill="#ffffff" font-family="Arial, sans-serif" font-size="11" font-weight="700">Handoff admin + reminder</text>
    <circle cx="300" cy="309" r="10" fill="url(#accent)"/>
    <path d="m296 309 3 3 6-7" fill="none" stroke="#fff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <rect x="44" y="357" width="80" height="22" rx="11" fill="#102c64" stroke="#284681"/>
  <text x="63" y="371" fill="#c4d9fa" font-family="Arial, sans-serif" font-size="8" font-weight="700">INBOX</text>
  <rect x="130" y="357" width="90" height="22" rx="11" fill="#102c64" stroke="#284681"/>
  <text x="150" y="371" fill="#c4d9fa" font-family="Arial, sans-serif" font-size="8" font-weight="700">HANDOFF</text>
  <rect x="226" y="357" width="100" height="22" rx="11" fill="#102c64" stroke="#284681"/>
  <text x="244" y="371" fill="#c4d9fa" font-family="Arial, sans-serif" font-size="8" font-weight="700">PIPELINE</text>
</svg>
