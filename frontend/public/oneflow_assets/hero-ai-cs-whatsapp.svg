<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 920" role="img" aria-labelledby="title desc">
  <title id="title">Oneflow AI CS WhatsApp workspace mockup</title>
  <desc id="desc">A polished Oneflow.id workspace showing WhatsApp conversations, AI CS assistance, admin handoff, and optional business tools.</desc>
  <defs>
    <linearGradient id="screen" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".55" stop-color="#f7fbff"/>
      <stop offset="1" stop-color="#eaf5ff"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#22c8ff"/>
      <stop offset=".55" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#7c4dff"/>
    </linearGradient>
    <linearGradient id="wa" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#21e29a"/>
      <stop offset="1" stop-color="#10b981"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="34" stdDeviation="28" flood-color="#0f3d91" flood-opacity=".18"/>
    </filter>
    <filter id="soft" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#0f172a" flood-opacity=".11"/>
    </filter>
    <style>
      .font{font-family:Inter,Segoe UI,Arial,sans-serif}
      .title{font-size:28px;font-weight:800;fill:#0f172a}
      .label{font-size:17px;font-weight:800;fill:#0f172a}
      .copy{font-size:14px;font-weight:600;fill:#64748b}
      .micro{font-size:12px;font-weight:700;fill:#64748b}
      .white{fill:#fff}
    </style>
  </defs>

  <rect width="1440" height="920" rx="58" fill="#eef8ff"/>
  <path d="M35 678C190 560 342 548 496 639s315 111 482 16 306-79 427 36v229H35Z" fill="#dff3ff"/>
  <path d="M118 166c204-130 424-142 659-36 230 103 387 68 537-8" fill="none" stroke="#b8e8ff" stroke-width="20" stroke-linecap="round" opacity=".55"/>
  <path d="M110 248c196-85 391-73 585 34 214 118 406 112 579-18" fill="none" stroke="#d8ebff" stroke-width="14" stroke-linecap="round" opacity=".9"/>

  <g filter="url(#shadow)" transform="translate(95 96)">
    <rect width="1250" height="720" rx="46" fill="url(#screen)" stroke="#d5e8fb" stroke-width="2"/>
    <rect x="0" y="0" width="1250" height="78" rx="46" fill="#ffffff"/>
    <path d="M0 54h1250" stroke="#e2edf7"/>
    <circle cx="42" cy="39" r="9" fill="#7c4dff"/>
    <circle cx="68" cy="39" r="9" fill="#21b7ff"/>
    <circle cx="94" cy="39" r="9" fill="#d8e7f5"/>
    <text x="135" y="49" class="font title">Oneflow.id AI CS</text>
    <rect x="1022" y="22" width="156" height="34" rx="17" fill="#eff8ff"/>
    <circle cx="1046" cy="39" r="8" fill="#22c55e"/>
    <text x="1064" y="44" class="font micro">AI CS online</text>

    <g transform="translate(36 112)">
      <rect width="325" height="524" rx="28" fill="#fff" stroke="#dce9f6" filter="url(#soft)"/>
      <text x="30" y="48" class="font label">Inbox WhatsApp</text>
      <text x="30" y="74" class="font copy">Pesan masuk siap ditangani.</text>
      <g transform="translate(28 108)">
        <rect width="270" height="74" rx="18" fill="#f0fbf6" stroke="#bff4d7"/>
        <circle cx="34" cy="37" r="20" fill="url(#wa)"/>
        <path d="M27 31c9-10 23 4 11 13l9 8c-18 5-34-9-29-27z" fill="#fff" opacity=".94"/>
        <text x="70" y="31" class="font micro" fill="#0f172a">Chat baru</text>
        <text x="70" y="53" class="font copy">Mau order hari ini?</text>
      </g>
      <g transform="translate(28 202)">
        <rect width="270" height="86" rx="18" fill="#eef6ff" stroke="#cfe5ff"/>
        <rect x="20" y="18" width="154" height="22" rx="11" fill="url(#brand)"/>
        <text x="34" y="34" class="font micro white">AI CS siap balas</text>
        <text x="20" y="63" class="font copy">Produk tersedia - siap diproses</text>
      </g>
      <g transform="translate(28 318)">
        <rect width="270" height="74" rx="18" fill="#fff7ed" stroke="#fed7aa"/>
        <text x="22" y="32" class="font micro" fill="#9a3412">Perlu konfirmasi</text>
        <text x="22" y="54" class="font copy">Admin ambil alih chat</text>
        <circle cx="226" cy="37" r="20" fill="#fb923c"/>
        <path d="M217 38h18M226 29v18" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
      </g>
      <g transform="translate(28 420)">
        <rect width="270" height="70" rx="18" fill="#f8fafc" stroke="#e2e8f0"/>
        <text x="22" y="31" class="font micro" fill="#0f172a">Draft pesanan dibuat</text>
        <text x="22" y="52" class="font copy">Lanjut dari percakapan ini</text>
      </g>
    </g>

    <g transform="translate(394 112)">
      <rect width="470" height="524" rx="28" fill="#fff" stroke="#dce9f6" filter="url(#soft)"/>
      <text x="30" y="48" class="font label">Conversation Inbox</text>
      <text x="30" y="74" class="font copy">AI aktif, admin tetap pegang kontrol.</text>
      <g transform="translate(30 112)">
        <rect width="410" height="340" rx="20" fill="#f8fafc" stroke="#e2e8f0"/>
        <circle cx="26" cy="32" r="8" fill="#22c55e"/>
        <text x="45" y="36" class="font micro" fill="#0f172a">Customer baru - WhatsApp</text>
        <rect x="294" y="18" width="96" height="28" rx="14" fill="#dcfce7"/>
        <text x="316" y="36" class="font micro" fill="#15803d">AI aktif</text>
        <rect x="18" y="72" width="196" height="62" rx="16" fill="#fff" stroke="#dce9f6"/>
        <text x="34" y="96" class="font micro" fill="#64748b">CUSTOMER</text>
        <text x="34" y="118" class="font copy" fill="#0f172a">Mau order hari ini?</text>
        <rect x="104" y="152" width="286" height="76" rx="16" fill="#eaf6ff" stroke="#cfe5ff"/>
        <text x="122" y="177" class="font micro" fill="#2563eb">AI CS</text>
        <text x="122" y="201" class="font copy" fill="#0f172a">Stok tersedia. Draft siap.</text>
        <rect x="18" y="252" width="372" height="66" rx="18" fill="#fff" stroke="#dce9f6"/>
        <text x="34" y="278" class="font micro" fill="#64748b">KONTROL ADMIN</text>
        <rect x="214" y="268" width="72" height="30" rx="15" fill="#ecfdf5"/>
        <text x="230" y="287" class="font micro" fill="#15803d">AI ON</text>
        <rect x="294" y="268" width="82" height="30" rx="15" fill="url(#brand)"/>
        <text x="307" y="287" class="font micro white">Take Over</text>
      </g>
    </g>

    <g transform="translate(896 112)">
      <rect width="318" height="524" rx="28" fill="#071c4d" filter="url(#soft)"/>
      <text x="30" y="48" class="font label white">Alat Bisnis</text>
      <text x="30" y="74" class="font copy" fill="#b9d7ff">Aktif saat dibutuhkan.</text>
      <g transform="translate(30 112)">
        <rect width="258" height="72" rx="20" fill="#102a69"/>
        <circle cx="39" cy="36" r="19" fill="#21b7ff"/>
        <text x="72" y="32" class="font micro white">Produk &amp; Stok</text>
        <text x="72" y="53" class="font copy" fill="#b9d7ff">Cek katalog dari chat</text>
      </g>
      <g transform="translate(30 204)">
        <rect width="258" height="72" rx="20" fill="#102a69"/>
        <circle cx="39" cy="36" r="19" fill="#7c4dff"/>
        <text x="72" y="32" class="font micro white">Booking</text>
        <text x="72" y="53" class="font copy" fill="#b9d7ff">Jadwal &amp; reminder</text>
      </g>
      <g transform="translate(30 296)">
        <rect width="258" height="72" rx="20" fill="#102a69"/>
        <circle cx="39" cy="36" r="19" fill="#22c55e"/>
        <text x="72" y="32" class="font micro white">Handoff</text>
        <text x="72" y="53" class="font copy" fill="#b9d7ff">Admin ambil alih</text>
      </g>
      <g transform="translate(30 408)">
        <rect width="258" height="62" rx="31" fill="#fff"/>
        <circle cx="42" cy="31" r="15" fill="#dcfce7"/>
        <path d="m35 31 5 5 10-12" fill="none" stroke="#16a34a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="70" y="37" class="font micro" fill="#0f172a">Fleksibel untuk tiap bisnis</text>
      </g>
    </g>
  </g>
</svg>
